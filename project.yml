# XcodeGen spec: `xcodegen` creates TaskLearn.xcodeproj from this file.
name: TaskLearn
options:
  bundleIdPrefix: com.japhet175
  deploymentTarget:
    iOS: "17.0"
packages:
  TaskCore:
    path: TaskCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TaskLearn:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TaskCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.japhet175.TaskLearn
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  TaskLearnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TaskLearn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.japhet175.TaskLearnUITests
        TEST_TARGET_NAME: TaskLearn
schemes:
  TaskLearn:
    build:
      targets:
        TaskLearn: all
    test:
      targets: [TaskLearnUITests]
